events {
    worker_connections 1024;
}

http {
    # Docker ichki DNS resolver — har 5s da qayta resolve qiladi, shuning
    # uchun yangi/qayta ishga tushgan v2 worker konteynerlari avtomatik
    # topiladi.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream ai_workers_v2 {
        least_conn;
        # Faqat v2 worker'lar. Docker DNS 'ai-worker-v2' ni barcha
        # replica IP'lariga resolve qiladi.
        server ai-worker-v2:8766;
    }

    server {
        listen 80;

        location /health {
            proxy_pass         http://ai_workers_v2;
            proxy_set_header   Host $host;
            proxy_read_timeout 5s;
        }

        location /start-session {
            proxy_pass         http://ai_workers_v2;
            proxy_set_header   Host $host;
            proxy_read_timeout 30s;
            # worker to'lib qolsa (503), keyingi worker'ga o'tadi.
            proxy_next_upstream error timeout http_503;
            proxy_next_upstream_tries 5;
        }
    }
}
