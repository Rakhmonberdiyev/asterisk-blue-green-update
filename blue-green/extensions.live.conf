 same => n,MixMonitor(${EXTEN}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}.wav)
 ; ---- Blue-green app tanlash (AstDB orqali, reload'siz cutover) ----
 ; AstDB bo'sh bo'lsa default 'ai-callcenter' (v1). Cutover:
 ;   asterisk -rx "database put bluegreen stasis_app ai-callcenter-v2"
 same => n,Set(STASIS_APP=${DB(bluegreen/stasis_app)})
 same => n,ExecIf($["${STASIS_APP}"=""]?Set(STASIS_APP=ai-callcenter))
 same => n,NoOp(Routing to Stasis app: ${STASIS_APP})
 same => n,Stasis(${STASIS_APP}, incoming)
 same => n,Hangup()
